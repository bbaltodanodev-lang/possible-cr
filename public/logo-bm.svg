<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none">
  <defs>
    <linearGradient id="bm-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#168BFF"/>
      <stop offset="30%"  stop-color="#7B2FFF"/>
      <stop offset="60%"  stop-color="#C800C8"/>
      <stop offset="80%"  stop-color="#F005BB"/>
      <stop offset="100%" stop-color="#FF2070"/>
    </linearGradient>
    <linearGradient id="bm-logo-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2090FF"/>
      <stop offset="50%"  stop-color="#9B00FF"/>
      <stop offset="100%" stop-color="#FF20A0"/>
    </linearGradient>
  </defs>

  <!-- B letter -->
  <!-- Vertical bar of B -->
  <rect x="20" y="15" width="18" height="110" rx="3" fill="url(#bm-logo-grad)"/>
  <!-- Top bump of B -->
  <path d="M38 15 Q80 15 80 40 Q80 65 38 65 Z" fill="url(#bm-logo-grad)"/>
  <!-- Bottom bump of B -->
  <path d="M38 65 Q88 65 88 90 Q88 125 38 125 Z" fill="url(#bm-logo-grad)"/>
  <!-- Inner cutout top -->
  <ellipse cx="55" cy="40" rx="14" ry="16" fill="black"/>
  <!-- Inner cutout bottom -->
  <ellipse cx="58" cy="92" rx="16" ry="20" fill="black"/>

  <!-- Diagonal slash through B -->
  <polygon points="18,125 36,125 42,15 24,15" fill="black" opacity="0.85"/>

  <!-- M letter -->
  <!-- Left leg of M -->
  <rect x="100" y="15" width="16" height="110" rx="3" fill="url(#bm-logo-grad2)"/>
  <!-- Right leg of M -->
  <rect x="164" y="15" width="16" height="110" rx="3" fill="url(#bm-logo-grad2)"/>
  <!-- Left diagonal of M -->
  <polygon points="100,15 116,15 140,75 124,75" fill="url(#bm-logo-grad2)"/>
  <!-- Right diagonal of M -->
  <polygon points="180,15 164,15 140,75 156,75" fill="url(#bm-logo-grad2)"/>
</svg>
